# MongoDB Web API 配置文件
server:
  host: "0.0.0.0"      # 监听地址
  port: 8080           # 监听端口
  mode: "debug"        # gin 运行模式: debug / release

mongo:
  uri: "mongodb://localhost:27017"   # MongoDB 连接串
  connect_timeout: 10s               # 连接超时
  request_timeout: 30s               # 请求超时
  white_list_dbs: [myapp, myapp2]   # 数据库访问白名单（留空表示不限制，仅列表内数据库允许被操作）

log:
  filename: "logs/app.log"   # 日志文件路径（留空则仅输出到控制台）
  max_size: 100               # 单个日志文件最大大小（MB），达到后滚动
  max_age: 7                  # 保留旧日志的最大天数，按天清理
  max_backups: 10             # 保留旧日志的最大数量（0 表示不限制）
  compress: true              # 滚动后的旧日志是否 gzip 压缩
  local_time: true            # 是否使用本地时间命名备份文件